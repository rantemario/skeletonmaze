    <line x1="32" y1="18" x2="37" y2="14" />
    <line x1="32" y1="46" x2="27" y2="50" />
    <line x1="32" y1="46" x2="37" y2="50" />
    <line x1="18" y1="32" x2="14" y2="27" />
    <line x1="18" y1="32" x2="14" y2="37" />
